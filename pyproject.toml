[project]
name = "crashmodel"
version = "0.1.0"
description = "Stress-test a portfolio split through real market crashes, then track the one you choose."
authors = [{ name = "Tom Firth" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "streamlit>=1.64",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Only resolve releases that are at least two weeks old at lock time.
exclude-newer = "2026-09-30T00:00:00Z"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "N",       # naming
    "D",       # pydocstyle
    "PT",      # pytest style
    "RUF",     # ruff-specific
    "PL",      # pylint
    "C4",      # comprehensions
    "PIE",     # misc lints
    "RET",     # return statements
    "PTH",     # prefer pathlib
    "ERA",     # commented-out code
    "T20",     # stray print calls
    "S",       # security
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S603", "S607", "PLR2004"]
"tools/**" = ["T201", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tools", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--disable-socket",
    "--allow-unix-socket",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["crashmodel", "tools"]
branch = true
# Page scripts are executed by Streamlit AppTest in tests/app, outside coverage's view.
omit = ["src/crashmodel/app/pages/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
