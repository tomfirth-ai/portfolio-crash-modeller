name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The same uv-managed CPython as local development, not the runner's system Python.
      UV_MANAGED_PYTHON: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz for this version. Update both together.
          checksum: "23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0"
          enable-cache: true

      - name: Install dependencies, failing if uv.lock is out of date
        id: install
        run: uv sync --locked

      # Every check below runs even if an earlier one fails, so one run reports them all.
      - name: Style (no dash lookalikes, British spelling)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --frozen python -m tools.check_style

      - name: Repository hygiene
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --frozen python -m tools.check_hygiene

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --frozen ruff check .

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --frozen ruff format --check .

      - name: Type-check (strict)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --frozen mypy

      - name: Test with full coverage (network blocked)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --frozen pytest --cov --cov-report=term

  secrets:
    name: Secret scan of the full history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan every commit on every ref
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="--all" .'
